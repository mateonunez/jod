name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Examples run offline
        run: |
          node examples/01-triage.ts
          node examples/02-moderation.ts
          node examples/04-extraction.ts
          node examples/05-chaining.ts

  e2e:
    name: Live E2E (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:e2e
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}

  artifact:
    name: dist loads on the declared minimum
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: |
          node -e "
            import('./dist/index.js').then((m) => {
              for (const key of ['semantics', 'fixtureFetch', 'choice', 'score', 'noul', 'TypeSafeClient', 'JodStateError']) {
                if (!(key in m)) throw new Error('missing export: ' + key);
              }
              console.log('dist ok');
            });
          "
